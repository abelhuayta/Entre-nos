workflows:
  ios-sideload:
    name: iOS Sideload
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Configurar proyecto Flutter iOS
        script: |
          flutter build ios --release --config-only \
            --dart-define=SUPABASE_URL=https://ncwrxbtvcvpbzeesdqhx.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jd3J4YnR2Y3ZwYnplZXNkcWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0OTIwODcsImV4cCI6MjExMTA2ODA4N30.9oB0NjyUu-_dTHNzG_5LSVDCwcF2EXkoFP3zTutCsOQ
      - name: Compilar Runner.app sin Development Team
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Empaquetar entre_nos.ipa
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/derived/Build/Products/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r -y entre_nos.ipa Payload
    artifacts:
      - build/ios/ipa/entre_nos.ipa